name: Glossy Brain V2 overload artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/characters-v2/brain/overloaded/sheet.webp'
      - 'tools/render_glossy_overloaded_v2.py'
      - '.github/workflows/glossy-overloaded-v2.yml'
permissions:
  contents: write
concurrency:
  group: glossy-brain-overloaded-v2-main
  cancel-in-progress: false
jobs:
  publish-glossy-raster:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.0.0'
      - run: python tools/render_glossy_overloaded_v2.py
      - name: Verify source and live assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          a=Path("assets/characters-v2/brain/overloaded")
          b=Path("assets/characters/brain/overloaded")
          meta=json.loads((a/"metadata.json").read_text())
          assert meta["frames"]==12
          for fn in ("sheet.png","preview.gif","metadata.json"):
              assert (a/fn).read_bytes()==(b/fn).read_bytes(),fn
          assert hashlib.sha256((a/"sheet.png").read_bytes()).hexdigest()==meta["sha256"]
          print("PASS: binaries, metadata and mirrors are valid")
          PY
      - name: Commit generated PNG GIF metadata and manifests to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters-v2/brain/overloaded assets/characters/brain/overloaded assets/characters-v2/brain/manifest.json assets/characters/brain/manifest.json
          if git diff --cached --quiet; then
            echo 'Artwork unchanged'
          else
            git commit -m 'assets: activate genuine glossy Brain overloaded sprites on main [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

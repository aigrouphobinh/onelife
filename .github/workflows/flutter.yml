name: Flutter checks
concurrency:
  group: onelife-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/test_today_tasks_sql.py'
      - 'tools/test_home_widget_sql.py'
      - 'tools/test_android_reminder_contract.py'
      - 'tools/test_brain_overlay_contract.py'
      - 'tools/test_usage_insights_contract.py'
      - 'tools/test_brain_native_clip_contract.py'
      - 'tools/test_brain_break_contract.py'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify native Today Tasks SQL filter
        run: python3 tools/test_today_tasks_sql.py
      - name: Verify home widget and Quick Settings time-bound SQL
        run: python3 tools/test_home_widget_sql.py
      - name: Verify Android reminder permission and native action contract
        run: python3 tools/test_android_reminder_contract.py
      - name: Verify real Android Brain overlay and special-access permission contract
        run: python3 tools/test_brain_overlay_contract.py
      - name: Verify opt-in usage insight and Brain behavior privacy contract
        run: python3 tools/test_usage_insights_contract.py
      - name: Verify native Brain 8/10/12-frame atlas geometry and timing
        run: python3 tools/test_brain_native_clip_contract.py
      - name: Verify persisted rest timer and one-shot Recovering animation contract
        run: python3 tools/test_brain_break_contract.py
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Compile Android Brain overlay, QS tiles, widget and task notifications
        run: flutter build apk --debug
      - name: Run real native Kotlin Brain monotonic and reboot policy tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Confirm bundled Glossy Kawaii Brain for native widget
        shell: bash
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'assets/flutter_assets/assets/characters-v2/brain/master.png'
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'assets/flutter_assets/assets/characters-v2/brain/idle/sheet.png'
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'assets/flutter_assets/assets/characters-v2/brain/focus/sheet.png'
          for state in balanced strained overloaded resting recovering; do
            unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx "assets/flutter_assets/assets/characters-v2/brain/$state/sheet.png"
          done
      - name: Save debug APK for Android device QA
        uses: actions/upload-artifact@v4
        with:
          name: onelife-v34-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Flutter checks
concurrency:
  group: onelife-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/test_today_tasks_sql.py'
      - 'tools/test_home_widget_sql.py'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify native Today Tasks SQL filter
        run: python3 tools/test_today_tasks_sql.py
      - name: Verify home widget and Quick Settings time-bound SQL
        run: python3 tools/test_home_widget_sql.py
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Compile Android app, three QS tiles and home widget
        run: flutter build apk --debug
      - name: Confirm bundled Glossy Kawaii Brain for native widget
        shell: bash
        run: |
          unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'assets/flutter_assets/assets/characters-v2/brain/master.png'
      - name: Save debug APK for Android device QA
        uses: actions/upload-artifact@v4
        with:
          name: onelife-v34-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

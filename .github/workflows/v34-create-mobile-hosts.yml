name: OneLife V3.4 generate mobile hosts (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v34-create-mobile-hosts.yml']
permissions:
  contents: write
jobs:
  generate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create missing native hosts without overwriting lib
        run: |
          flutter create --project-name onelife --org com.aigrouphobinh --platforms=android,ios .
          flutter pub get
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
          test -f ios/Runner/Info.plist
      - name: Commit only the generated platform hosts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android ios .metadata
          if git diff --cached --quiet; then
            echo 'Mobile hosts already exist'
            exit 0
          fi
          git commit -m 'build(v3.4): generate Android and iOS Flutter platform hosts'
          for n in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

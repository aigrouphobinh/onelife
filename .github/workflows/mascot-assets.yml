name: Render mascot sprites
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/characters/**/sheet.svg'
      - 'tools/generate_character_assets.py'
      - '.github/workflows/mascot-assets.yml'
permissions:
  contents: write
concurrency:
  group: mascot-assets-main
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'CairoSVG==2.7.1' 'Pillow==11.0.0'
      - run: python tools/generate_character_assets.py
      - name: Verify generated artifacts
        shell: bash
        run: |
          test -f assets/characters/brain/remind/sheet.png
          test -f assets/characters/brain/remind/preview.gif
          test -f assets/characters/brain/remind/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path("assets/characters/brain").glob("*/metadata.json"))
          assert len(paths)==15, f"Expected 15 brain states, found {len(paths)}"
          assert sum(json.loads(p.read_text())["frames"] for p in paths)==156
          print("PASS: 15 brain animations, 156 frames")
          PY
      - name: Commit rendered image assets directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'assets: render mascot PNG atlases, GIF previews and manifests [skip ci]'
            # Concurrent design/QA workflows also commit on main; rebase before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Assets published on main'
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Failed to publish after three safe rebase attempts' >&2
                exit 1
              fi
              sleep 3
            done
          fi

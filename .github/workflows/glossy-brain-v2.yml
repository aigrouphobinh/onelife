name: Mirror canonical glossy Brain V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/characters/brain/master.png'
      - 'assets/characters/brain/remind/sheet.png'
      - 'assets/characters/brain/remind/metadata.json'
      - 'tools/render_glossy_brain_v2.py'
      - '.github/workflows/glossy-brain-v2.yml'
permissions:
  contents: write
concurrency:
  group: onelife-glossy-v2-main
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.0.0'
      - run: python tools/render_glossy_brain_v2.py
      - name: Commit versioned mirror to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters-v2/brain
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'assets: sync glossy Brain V2 mirror [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

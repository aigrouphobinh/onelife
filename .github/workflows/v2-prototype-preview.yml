name: OneLife V2 design prototype screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'design/prototype-v2/index.html'
      - 'design/prototype-v2/app.js'
      - 'design/prototype-v2/style.css'
      - 'tools/check_v2_design_prototype.py'
      - '.github/workflows/v2-prototype-preview.yml'
permissions:
  contents: write
concurrency:
  group: onelife-v2-screenshots
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check design/prototype-v2/app.js
      - run: python -m pip install 'playwright==1.56.0'
      - name: Render 10 mobile and 4 desktop page designs
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'Using system Google Chrome'
          else
            python -m playwright install --with-deps chromium
          fi
          python tools/check_v2_design_prototype.py
      - name: Publish screenshot evidence on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/prototype-v2/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'design: add real mobile/desktop prototype screenshots [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 4
            done
          fi

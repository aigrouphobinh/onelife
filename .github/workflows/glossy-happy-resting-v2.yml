name: Glossy V2 Happy and Resting candidate assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_glossy_happy_resting_v2.py'
      - '.github/workflows/glossy-happy-resting-v2.yml'
      - 'assets/characters-v2/brain/idle/sheet.png'
      - 'assets/characters-v2/brain/overloaded/sheet.png'
permissions:
  contents: write
concurrency:
  group: glossy-happy-resting-main
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.0.0'
      - run: python tools/build_glossy_happy_resting_v2.py
      - name: Verify source and live paths
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for state,expected in [('happy',12),('resting',10)]:
              a=Path('assets/characters-v2/brain')/state
              b=Path('assets/characters/brain')/state
              m=json.loads((a/'metadata.json').read_text())
              assert m['frames']==expected
              for name in ('sheet.png','sheet.webp','preview.gif','metadata.json'):
                  assert (a/name).read_bytes()==(b/name).read_bytes(),(state,name)
              assert hashlib.sha256((a/'sheet.png').read_bytes()).hexdigest()==m['sha256']
              print('PASS',state,expected,'frames')
          PY
      - name: Commit candidates directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters-v2/brain/{happy,resting,manifest.json} assets/characters/brain/{happy,resting,manifest.json}
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'assets: render glossy Happy and Resting candidates [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: OneLife - 15 minute auto progress
on:
  schedule:
    # Every 15 minutes, off the top of the hour to reduce GitHub queue delays.
    # UTC minutes 07, 22, 37, 52 = same minutes in Asia/Ho_Chi_Minh.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/onelife_autopilot.py'
      - 'tools/audit_glossy_sprite_integrity.py'
      - '.github/workflows/onelife-autopilot-15m.yml'
permissions:
  contents: write
concurrency:
  group: onelife-autopilot-main
  cancel-in-progress: false
jobs:
  progress:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.0.0'
      - name: Validate worker itself
        run: python tools/onelife_autopilot.py --self-test
      - name: Independently audit registered sprites and GIF playback
        run: python tools/audit_glossy_sprite_integrity.py
      - name: Pick and execute next safe source-backed task
        run: python tools/onelife_autopilot.py
      - name: Commit verified updates directly to main (no empty commits)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters-v2 docs/OTHER_MASCOT_COVERAGE.md docs/NEXT_AUTO_TASK.md
          git add design/review/glossy-cat-idle.html design/review/cat-glossy-v2-contact.png
          git add design/review/reports/other-mascot-coverage.json
          if git diff --cached --quiet; then
            echo 'No new source-backed task; nothing to push.'
            exit 0
          fi
          git commit -m 'chore: continue verified OneLife animation backlog [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Committed safe progress to main.'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Could not push after retry; leaving repo unmodified on remote.' >&2
              exit 1
            fi
            sleep 3
          done
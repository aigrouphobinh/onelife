name: Build glossy character animation assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/characters-v2/animation_sources.json'
      - 'assets/characters-v2/**/sheet_illustrated.webp'
      - 'tools/render_glossy_character_animation.py'
      - '.github/workflows/glossy-character-animations.yml'
permissions:
  contents: write
concurrency:
  group: onelife-character-assets-main
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.0.0'
      - name: Render and validate original illustrated frames
        run: python tools/render_glossy_character_animation.py
      - name: Update coverage from newly rendered assets (avoid stale reports)
        run: |
          python tools/check_mascot_coverage.py
          python tools/check_cat_glossy_review.py
      - name: Commit generated RGBA atlases and QA to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters-v2
          git add docs/OTHER_MASCOT_COVERAGE.md design/review/reports/other-mascot-coverage.json
          if git diff --cached --quiet; then
            echo 'Assets already up to date'
          else
            git commit -m 'assets: render sourced glossy character animation candidates'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Published on main'
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi

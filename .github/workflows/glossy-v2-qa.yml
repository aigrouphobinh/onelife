name: Glossy V2 asset QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check_glossy_v2_assets.py'
      - 'design/review/glossy-v2.html'
      - '.github/workflows/glossy-v2-qa.yml'
      - 'assets/characters-v2/brain/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.0.0'
      - run: python tools/check_glossy_v2_assets.py
      - name: Check review page JavaScript syntax
        run: |
          python - <<'PY' > /tmp/preview.js
          import re
          from pathlib import Path
          p=Path('design/review/glossy-v2.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',p)
          assert m, 'Missing viewer JS'
          print(m.group(1))
          PY
          node --check /tmp/preview.js

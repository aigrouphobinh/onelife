name: Glossy character coverage audit
on:
  workflow_dispatch:
  # Run after generated metadata/sprites change, not when source catalog/gallery
  # changes before the raster builder has produced files. The builder itself
  # runs both the coverage and viewer checks on the new raster assets.
  push:
    paths:
      - 'assets/characters-v2/**/metadata.json'
      - 'assets/characters-v2/**/sheet.png'
      - 'assets/characters-v2/**/preview.gif'
      - 'tools/check_mascot_coverage.py'
      - 'tools/render_cat_glossy_contact.py'
      - 'tools/check_cat_glossy_review.py'
      - '.github/workflows/mascot-v2-coverage.yml'
permissions:
  contents: write
concurrency:
  group: onelife-mascot-coverage
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.0.0'
      - run: python tools/check_mascot_coverage.py
      - run: python tools/render_cat_glossy_contact.py
      - run: python tools/check_cat_glossy_review.py
      - name: Commit evidence report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/OTHER_MASCOT_COVERAGE.md design/review/reports/other-mascot-coverage.json design/review/cat-glossy-v2-contact.png
          if git diff --cached --quiet; then
            echo 'No coverage changes'
          else
            git commit -m 'docs: refresh truthful mascot coverage [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi

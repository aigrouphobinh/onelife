name: Render dark design screens
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/render_dark_screens.py'
      - '.github/workflows/dark-design.yml'
      - 'design/screens/*.svg'
permissions:
  contents: write
concurrency:
  group: onelife-dark-design-main
  cancel-in-progress: false
jobs:
  dark-design:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.0.0'
      - run: python tools/render_dark_screens.py
      - name: Commit dark SVG, PNG and manifests directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/screens/dark
          if git diff --cached --quiet; then
            echo 'Dark screens unchanged'
          else
            git commit -m 'design: render dark theme screens [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

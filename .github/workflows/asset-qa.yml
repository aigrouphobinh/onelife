name: Asset QA and contact sheets
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check_design_assets.py'
      - '.github/workflows/asset-qa.yml'
      - 'assets/characters/**/sheet.png'
      - 'assets/characters/**/metadata.json'
      - 'assets/sounds/**'
      - 'design/screens/**'
      - 'design/wellbeing/**'
      - 'design/review/index.html'
      - 'tools/check_design_review.py'
permissions:
  contents: write
concurrency:
  group: onelife-design-qa-main
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.0.0'
      - run: python tools/check_design_assets.py
      - run: python tools/check_design_review.py
      - name: Commit contact sheets and reports to main
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/review/reports design/review/contact-sheets
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'design: add contact sheets and asset QA results [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
